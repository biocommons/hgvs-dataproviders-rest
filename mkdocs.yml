site_name: hgvs-dataproviders-rest
repo_url: https://github.com/biocommons/hgvs-dataproviders-rest
site_url: https://biocommons.github.io/hgvs-dataproviders-rest
site_description: REST-backed hgvs data provider for UTA and SeqRepo
site_author: Biocommons Contributors
edit_uri: edit/main/docs/
repo_name: biocommons/hgvs-dataproviders-rest
copyright: Maintained by <a href="https://biocommons.com">biocommons</a>.

plugins:
  - search
  - awesome-nav

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/biocommons/hgvs-dataproviders-rest
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/hgvs_dataproviders_rest/

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
